# NOTE: every single option can be omitted
[config]
sorting = "ByDurationAscending" # ByTitleAscending, ByTitleDescending, ByDurationAscending, ByDurationDescending, Shuffle
repeat = "AllMusics" # repeat state, other avilable options are `Dont, ThisMusic`
fps = 30 # FPS, default to 30
lyrics = true # display lyrics, defaults to false
genre = false # display genre, default to false

[scripts]
# region_name = path/to/script.lua
# only full path work for now
all = "/home/user/.config/codj/lua/all.lua"
list = "/home/user/.config/codj/lua/list.lua"
# lyrics = "/home/user/.config/codj/list.lua"
# actions = "/home/user/.config/codj/actions.lua"
# seeker = "/home/user/.config/codj/seeker.lua"
# volume = "/home/user/.config/codj/volume.lua"

[soulseek]
# soulseek network search for music
# enabled = true
# username = "your_username"
# password = "your_password"
# server_host = "server.slsknet.org"
# server_port = 2242
# listen_port = 2234
# max_results = 50
# result ranking/filtering:
# formats = ["flac", "mp3", "ogg"]  # only show these, earlier = preferred (unset: all audio)
# min_bitrate = 256                 # hide lossy files below this kbps (lossless always kept)
# max_size_mb = 0                   # hide files bigger than this, 0 = no limit
# prefer_free_slots = true          # rank peers with free upload slots higher
# download_dir = "/home/user/Music/soulseek"
# share_dir = "/home/user/Music/shared"  # optional, uses dummy file if not set

[agent]
# the AI agent behind the DJ screen's prompt box (:ai <text>, F11); codj holds no AI keys, the
# command brings its own login. Split on spaces, "double quotes" group words.
# command = "claude -p"
# live = false            # true: the agent's MCP server may arm/preview/load (codj mcp --live)
# prompt_via = "stdin"    # "stdin": prompt on stdin; "arg": prompt as the last argument
# mcp_tools = ["sets_list", "set_source", "set_check", "set_write"]   # allow-list, unset = all set tools

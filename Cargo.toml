# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[package]
authors = [
    "yasssine <yassine.bna@proton.me>",
    "Tommi Niemi <tommi@rotko.net>",
]
# "musa" is taken on crates.io; the binary is still called musa
name = "musa-player"
version = "0.2.0"
edition = "2021"
readme = "README.md"
license = "GPL-3.0-or-later"
repository = "https://github.com/yassinebenarbia/mplayer-client"
description = "musa: terminal music player with built-in Soulseek, the TUI for musad"
keywords = ["music", "music-player", "tui", "soulseek", "dbus"]

[[bin]]
name = "musa"
path = "src/main.rs"


[dependencies]
basic-toml = "0.1.9"
crossterm = "0.27.0"
dirs = "5.0"
flate2 = "1.0"
futures = "0.3.31"
md5 = "0.7"
ratatui = "0.28.0"
serde = "1.0.204"
tokio = { version = "1.44.1", features = ["full"] }
tui-input = "0.11.0"
zbus = { version = "5.11.0", features = ["tokio"] }
mlua = { version = "0.10.3", features = ["luajit", "serialize"] }
regex = "1"
toml_edit = "0.22"
rmcp = { version = "3.6.0", features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
serde_json = "1.0.154"
